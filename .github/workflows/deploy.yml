name: 🚀 Deploy Social Studio to ndoa.kesug.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publish Social Studio to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ndoa repository
        uses: actions/checkout@v4

      - name: Prepare clean public website
        run: |
          mkdir -p deploy
          cp index.html deploy/index.html
          printf '%s\n' 'Options -Indexes' > deploy/.htaccess

      - name: Deploy using the existing Ndoa hosting credentials
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: deploy/
          server-dir: /ndoa.kesug.com/htdocs/
          protocol: ftp
          port: 21
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.github/**
