name: Deploy NDOA multi-page website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    name: Publish all NDOA pages to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ndoa repository
        uses: actions/checkout@v4
      - name: Prepare full website
        run: |
          mkdir -p deploy
          cp -R index.html about.html services.html diagnostics.html advertising.html scheduler.html booking.html gallery.html pricing.html faq.html contact.html assets deploy/
          printf '%s\n' 'Options -Indexes' 'DirectoryIndex index.html' > deploy/.htaccess
      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: deploy/
          server-dir: /ndoa.kesug.com/htdocs/
          protocol: ftp
          port: 21
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.github/**
