name: Deploy NDOA multi-page website
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'index.html'
      - 'scheduler.html'
      - 'privacy.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'report-studio/**'
      - 'api/**'
      - 'assets/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    name: Publish all NDOA pages to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ndoa repository
        uses: actions/checkout@v4
      - name: Set up PHP for planner validation
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Validate research planner PHP
        run: php -l api/research-plan.php
      - name: Validate scheduler JavaScript
        run: node --check assets/main.js
      - name: Prepare full website
        run: |
          mkdir -p deploy
          cp -R index.html about.html services.html diagnostics.html advertising.html scheduler.html booking.html gallery.html pricing.html faq.html contact.html privacy.html robots.txt sitemap.xml assets deploy/
          cp -R report-studio deploy/
          cp -R api deploy/
          cat > deploy/.htaccess <<'HTACCESS'
          Options -Indexes
          DirectoryIndex index.html
          <IfModule mod_headers.c>
            Header always set X-Content-Type-Options "nosniff"
            Header always set X-Frame-Options "DENY"
            Header always set Referrer-Policy "strict-origin-when-cross-origin"
            Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
            Header always set Strict-Transport-Security "max-age=31536000"
          </IfModule>
          <FilesMatch "(^\.|\.(env|ini|log|sql|bak|dist|example)$)">
            Require all denied
          </FilesMatch>
          HTACCESS
      - name: Deploy to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: deploy/
          server-dir: /ndoa.kesug.com/htdocs/
          protocol: ftp
          port: 21
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.github/**
            **/includes/config.php
