name: 🚀 Deploy Social Media Ad Scheduler to ndoa.kesug.com

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Publish Social Media Ad Scheduler to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Social Media Ad Scheduler source
        uses: actions/checkout@v4
        with:
          repository: raymondsondo0-a11y/afrika-flix
          ref: main
          path: site

      - name: Deploy scheduler using the existing Ndoa hosting credentials
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: site/
          server-dir: /ndoa.kesug.com/htdocs/
          protocol: ftp
          port: 21
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.github/**
            **/private/config.php
            **/private/**
            **/uploads/**
            **/vendor/**
            **/setup.php
            **/login.php
            **/watch.php
            **/logout.php
            **/admin/**
            **/partials/**
            **/assets/**
